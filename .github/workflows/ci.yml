# Every push and pull request: install, audit, type-check, migrate a fresh
# PostgreSQL 16, seed, test, compile, and build the production image.
# Deployment to the VPS is added once the server exists.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: store
          POSTGRES_PASSWORD: store
          POSTGRES_DB: store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PUBLIC_URL: http://localhost:3000
      DATABASE_URL: postgres://store:store@localhost:5432/store

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm run audit:deps

      - name: Type-check
        run: npm run typecheck

      # Throwaway keys, new every run. Real keys never leave the server.
      - name: Generate per-run test keys
        run: |
          for name in ENCRYPTION_KEY BLIND_INDEX_KEY SESSION_SECRET; do
            value=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Apply database migrations
        run: npm run migrate

      - name: Seed placeholder catalogue
        run: npm run seed

      - name: Run tests
        run: npm test

      - name: Compile
        run: npm run build

  image:
    name: Production image
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag davmad-store:${{ github.sha }} .

      - name: Image runs as an unprivileged user
        run: |
          user=$(docker image inspect --format '{{.Config.User}}' davmad-store:${{ github.sha }})
          echo "Runtime user: $user"
          test "$user" = "node"
