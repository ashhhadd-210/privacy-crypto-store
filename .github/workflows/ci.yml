# Every push and pull request: install, audit, type-check, migrate a fresh
# PostgreSQL 16, seed, test, compile, and build the production image.
# Deployment to the VPS is added once the server exists.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: store
          POSTGRES_PASSWORD: store
          POSTGRES_DB: store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PUBLIC_URL: http://localhost:3000
      DATABASE_URL: postgres://store:store@localhost:5432/store

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm run audit:deps

      - name: Type-check
        run: npm run typecheck

      # Throwaway keys, new every run. Real keys never leave the server.
      - name: Generate per-run test keys
        run: |
          for name in ENCRYPTION_KEY BLIND_INDEX_KEY SESSION_SECRET; do
            value=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Apply database migrations
        run: npm run migrate

      - name: Seed placeholder catalogue
        run: npm run seed

      - name: Run tests
        run: npm test

      - name: Compile
        run: npm run build

  image:
    name: Production image
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: store
          POSTGRES_PASSWORD: store
          POSTGRES_DB: store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag davmad-store:${{ github.sha }} .

      - name: Image runs as an unprivileged user
        run: |
          user=$(docker image inspect --format '{{.Config.User}}' davmad-store:${{ github.sha }})
          echo "Runtime user: $user"
          test "$user" = "node"

      # Tests run from source; production runs compiled code from dist/. This
      # proves the image itself can migrate a database and serve real pages.
      - name: Smoke test the image
        run: |
          key() { node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"; }
          cat > smoke.env <<EOF
          NODE_ENV=production
          PORT=3000
          PUBLIC_URL=http://localhost:3000
          DATABASE_URL=postgres://store:store@127.0.0.1:5432/store
          ENCRYPTION_KEY=$(key)
          BLIND_INDEX_KEY=$(key)
          SESSION_SECRET=$(key)
          EOF
          img=davmad-store:${{ github.sha }}
          docker run --rm --network host --env-file smoke.env "$img" node dist/scripts/migrate.js
          docker run -d --name smoke --network host --env-file smoke.env "$img"
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3000/healthz >/dev/null && break; sleep 1; done
          check() {
            got=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$1")
            echo "$1 -> $got (want $2)"
            test "$got" = "$2"
          }
          ok=0
          check / 200 || ok=1
          check /assets/app.css 200 || ok=1
          check /cart 200 || ok=1
          check /order 200 || ok=1
          check /admin/login 200 || ok=1
          check /no-such-page 404 || ok=1
          if [ "$ok" != 0 ]; then docker logs smoke | tail -40; fi
          docker rm -f smoke >/dev/null
          rm smoke.env
          exit $ok
