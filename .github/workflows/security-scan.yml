# Security scans, kept apart from CI/deploy on purpose: these jobs run
# third-party scanners, so they get no secrets and read-only access. Nothing
# here can reach the server or the deploy key.
#
#   image:  Trivy over the production image (OS packages + npm), pinned
#           version, checksum-verified. Fails on fixable HIGH/CRITICAL.
#   admin:  OWASP ZAP baseline (passive) over the admin while signed in, against
#           a throwaway copy of the store started in this job.
#
# Weekly, on demand, and whenever the image's inputs change.

name: Security scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths: ['Dockerfile', 'package-lock.json', '.github/workflows/security-scan.yml']

permissions:
  contents: read

jobs:
  image:
    name: Image vulnerabilities (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag davmad-store:scan .

      - name: Install Trivy (pinned, checksum-verified)
        run: |
          v=0.58.1
          base="https://github.com/aquasecurity/trivy/releases/download/v$v"
          curl -fsSLO "$base/trivy_${v}_Linux-64bit.tar.gz"
          curl -fsSLO "$base/trivy_${v}_checksums.txt"
          grep " trivy_${v}_Linux-64bit.tar.gz\$" "trivy_${v}_checksums.txt" | sha256sum -c -
          tar -xzf "trivy_${v}_Linux-64bit.tar.gz" trivy
          ./trivy --version

      - name: Full report (all severities)
        run: ./trivy image --scanners vuln --no-progress --format table --output trivy-report.txt davmad-store:scan

      - name: Gate on fixable HIGH and CRITICAL
        run: ./trivy image --scanners vuln --no-progress --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 davmad-store:scan

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 30

  admin:
    name: Admin, signed in (ZAP baseline)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: store
          POSTGRES_PASSWORD: store
          POSTGRES_DB: store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag davmad-store:scan .

      - name: Start a throwaway store with placeholder products
        run: |
          key() { node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"; }
          cat > scan.env <<EOF
          NODE_ENV=production
          PORT=3000
          PUBLIC_URL=http://127.0.0.1:3000
          DATABASE_URL=postgres://store:store@127.0.0.1:5432/store
          ENCRYPTION_KEY=$(key)
          BLIND_INDEX_KEY=$(key)
          SESSION_SECRET=$(key)
          EOF
          img=davmad-store:scan
          docker run --rm --network host --env-file scan.env "$img" node dist/scripts/migrate.js
          docker run --rm --network host --env-file scan.env "$img" node dist/scripts/seed.js
          docker run -d --name store --network host --env-file scan.env "$img"
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3000/healthz >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:3000/healthz

      # The cookies are Secure in production, and this is plain http on the
      # runner, so they are carried by hand rather than by a cookie jar.
      - name: Sign in as a throwaway admin
        run: |
          pw=$(docker run --rm --network host --env-file scan.env davmad-store:scan \
                 node dist/scripts/create-admin.js zap@example.com | sed -n 's/^ *password: //p')
          echo "::add-mask::$pw"
          test -n "$pw"
          curl -s -D login-get.txt -o login.html http://127.0.0.1:3000/admin/login
          csrf_cookie=$(grep -i '^set-cookie: _csrf=' login-get.txt | sed 's/^[^:]*: //; s/;.*//' | tr -d '\r')
          token=$(grep -o 'name="_csrf" value="[^"]*"' login.html | head -1 | sed 's/.*value="//; s/"$//')
          curl -s -D login-post.txt -o /dev/null -H "Cookie: $csrf_cookie" \
            --data-urlencode "_csrf=$token" --data-urlencode "email=zap@example.com" --data-urlencode "password=$pw" \
            http://127.0.0.1:3000/admin/login
          session=$(grep -i '^set-cookie: admin_session=' login-post.txt | sed 's/^[^:]*: //; s/;.*//' | tr -d '\r')
          test -n "$session"
          echo "::add-mask::${session#admin_session=}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Cookie: $session" http://127.0.0.1:3000/admin)
          echo "GET /admin with the session -> $code"
          test "$code" = "200"
          echo "ADMIN_COOKIE=$session" >> "$GITHUB_ENV"
          rm -f login-get.txt login-post.txt login.html

      # Passive scan plus spider. The session goes in a fixed Cookie header, so
      # the CSRF cookie is never sent and no admin form can actually be
      # submitted: the scan looks, it does not change anything.
      - name: ZAP baseline over the admin
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:3000/admin -m 2 -I -r zap-admin.html -w zap-admin.md \
            -z "-config spider.threadCount=1 \
                -config replacer.full_list(0).description=admin-session \
                -config replacer.full_list(0).enabled=true \
                -config replacer.full_list(0).matchtype=REQ_HEADER \
                -config replacer.full_list(0).matchstr=Cookie \
                -config replacer.full_list(0).regex=false \
                -config replacer.full_list(0).replacement=$ADMIN_COOKIE"
          echo "admin pages the spider reached:"
          grep -o 'http://127.0.0.1:3000/admin[^ <")]*' zap/zap-admin.md | sort -u | head -40 || true

      - name: Store stops cleanly
        if: always()
        run: |
          docker logs store 2>&1 | grep -c '"statusCode":500' || true
          docker rm -f store >/dev/null 2>&1 || true
          rm -f scan.env

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-admin-report
          path: zap/
          retention-days: 30
