# Production stack for the VPS.
#
# BTCPay Server is deliberately NOT in this file. It ships its own multi-service
# compose stack and is managed separately on the same box, so that updating the
# shop never risks restarting a Bitcoin node mid-sync. See docs/RUNBOOK.md.
#
# Nothing here publishes a port to the public internet except Caddy, and the
# host firewall only accepts 80/443 from Cloudflare's IP ranges.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-store}
      POSTGRES_USER: ${POSTGRES_USER:-store}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-store} -d ${POSTGRES_DB:-store}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # no ports: the database is reachable only from the app container
    networks: [internal]

  app:
    # Built by CI and delivered by deploy/davmad-deploy.sh; the server never builds.
    image: davmad-store:current
    pull_policy: never
    restart: unless-stopped
    env_file: /etc/davmad-store/app.env   # 600 root:root on the host, outside the repo
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/src/public/uploads
      - exports:/app/exports
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # btcpay: BTCPay's own network, so the app can create invoices without BTCPay being public.
    networks: [internal, edge, btcpay]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # The Caddyfile is written once and never edited per environment; the
    # hostname it serves comes from here. Set SITE_DOMAIN in the deploy shell's
    # .env next to docker-compose.yml (not the app secrets file).
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is required}
      BTCPAY_DOMAIN: ${BTCPAY_DOMAIN:-pay.invalid}
    # 443 only. Cloudflare (Full strict) reaches the origin on 443 alone, and
    # BTCPay's own container already holds host port 80.
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro      # Cloudflare origin certificate
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [edge, btcpay]

  # Retention purge. Runs on a schedule inside its own short-lived container so a
  # hung purge can never take the storefront down with it.
  purge:
    image: davmad-store:current
    pull_policy: never
    restart: unless-stopped
    env_file: /etc/davmad-store/app.env
    command: ["node", "dist/scripts/purge.js"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - exports:/app/exports
    profiles: ["cron"]   # invoked by a systemd timer, not run continuously
    networks: [internal]

volumes:
  pgdata:
  uploads:
  exports:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true    # no outbound route, db cannot phone home
  edge:
  btcpay:
    external: true
    name: ${BTCPAY_NETWORK:-generated_default}
